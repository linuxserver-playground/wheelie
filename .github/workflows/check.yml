name: Check

on:
  push:
    branches: [main]
    paths-ignore: [docs/**]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .

      - name: Shellcheck
        run: shellcheck scripts/*.sh
